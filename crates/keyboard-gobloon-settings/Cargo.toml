[package]
name = "keyboard-gobloon-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keyboard Gobloon's settings window: a separate process, started from the tray, so the app stays light"

[[bin]]
name = "KeyboardGobloonSettings"
path = "src/main.rs"

[dependencies]
kbg-core.workspace = true
kbg-platform.workspace = true
kbg-settings.workspace = true
gob-i18n.workspace = true
gob-ui.workspace = true
eframe.workspace = true
# The Languages tab: the pack catalog and downloads, over Windows' own TLS.
serde.workspace = true
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[build-dependencies]
winresource = "0.1"
