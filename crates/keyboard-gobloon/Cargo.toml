[package]
name = "keyboard-gobloon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "KeyboardGobloon"
path = "src/main.rs"

[dependencies]
kbg-core.workspace = true
kbg-platform.workspace = true
kbg-settings.workspace = true
gob-i18n.workspace = true
log.workspace = true
# Reading .lng language packs: unpacking only, in Rust.
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
winresource = "0.1"
