[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# Local builds only: releases take their version from the commits (.github/scripts/next-version.sh).
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
kbg-core = { path = "crates/kbg-core" }
kbg-platform = { path = "crates/kbg-platform" }
# Shared with Joystick Gobloon. Local work on it: .cargo/config.toml.off (CLAUDE.md, Layout).
gob-i18n = { git = "https://github.com/h0useRus/gobloon-common-ui", tag = "v0.1.0" }
windows = "0.62"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
# The OpenGL renderer: wgpu reserves hundreds of MB, the settings window stays small with glow.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "links"] }
egui = "0.37"
kbg-settings = { path = "crates/kbg-settings" }
kbg-pack-builder = { path = "crates/kbg-pack-builder" }
# Language packs: word forms as a finite state transducer, read straight from the mapped file.
fst = "0.4"
gob-ui = { git = "https://github.com/h0useRus/gobloon-common-ui", tag = "v0.1.0" }

[profile.release]
lto = true
codegen-units = 1
strip = true
# The background process stays small; a panic inside a hook aborts anyway.
panic = "abort"
